name: CI

# 三条铁律（改这个文件前请先读）：
# 1) CI 里不跑真实 LLM：不调用任何 LLM API、不读 LLM_API_KEY / DEEPSEEK_API_KEY；
# 2) CI 里不出现任何密钥：需要的变量一律在仓库 Settings 里配，不写进 YAML；
# 3) 评测只跑 --no-llm 确定性路径，真实 LLM 全量评测留在收口阶段人工跑。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      neo4j_parity:
        description: "是否跑 Neo4j live parity（需要服务，单独手动触发）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: ruff（只查本 PR 改动的 py 文件）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要与基线 commit 做 diff，浅克隆不够
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装依赖（不装 torch，与 README §10.1 的轻量路径一致）
        run: uv sync --extra dev --no-install-package torch
      - name: ruff check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::找不到比对基线（首次推送 / workflow_dispatch），跳过 ruff"
            exit 0
          fi
          git diff --name-only --diff-filter=ACM "${BASE}...${{ github.sha }}" -- '*.py' > changed.txt || true
          if [ ! -s changed.txt ]; then
            echo "本次改动没有 .py 文件，跳过 ruff"
            exit 0
          fi
          echo "本次改动的 Python 文件："
          cat changed.txt
          mapfile -t FILES < changed.txt
          uv run ruff check "${FILES[@]}"

  test:
    name: 建图 + 单测（不依赖模型与 API key）
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装依赖（不装 torch）
        run: uv sync --extra dev --no-install-package torch
      - name: 建图（README §10.1 第 2 条命令）
        run: uv run python scripts/build_graph.py
      - name: 图版本 manifest（同输入同 graph_build_id）
        run: |
          uv run python - <<'PY'
          import json
          from app.__003__graph.__005__version import read_manifest
          m = read_manifest()
          assert m, "缺 data/graph/graph_manifest.json"
          assert m["graph_build_id"].startswith("g"), m
          assert m["nodes"] > 0 and m["edges"] > 0, m
          print("graph_build_id=%s nodes=%s edges=%s" % (m["graph_build_id"], m["nodes"], m["edges"]))
          print(json.dumps(m["relationships"], ensure_ascii=False))
          PY
      - name: 图一致性（离线 fixture + 注入差异自检；Neo4j 未启动则显式 skipped）
        run: uv run python scripts/check_graph_parity.py
      - name: 同步/流式契约（fixture，不调付费 LLM）
        run: uv run python scripts/check_stream_contract.py
      - name: 术语库一致性（种子 → jsonl，秒级、不写文件）
        run: uv run python app/__001__ingest/__001__build_lexicon.py --check
      - name: 流式 ContextVar 回归（/ask/stream 跨 Context 复位）
        run: uv run python -m pytest tests/test_stream_contract.py::test_stream_survives_starlette_threadpool_context_switch -q
      - name: 单元测试（ruff 之外的回归面：闸门 / 槽位 / checkpoint / 术语库 / 注入）
        run: uv run python -m pytest -m "not slow" -q

  offline-eval:
    name: 离线评测（--no-llm，不调真实 LLM）
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装依赖（不装 torch）
        run: uv sync --extra dev --no-install-package torch
      - name: 统一评测入口（--no-llm）
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/run_all_evals.py ]; then
            echo "::notice::scripts/run_all_evals.py 尚未合入（T08 任务）；跳过，确定性回归已由 test 任务覆盖"
            exit 0
          fi
          # 六个 eval 里有四个依赖 bge 模型与 data/index（README §10.2），CI 不下载 2 GB 模型；
          # 自托管 runner 或本地已建索引时，这条会自动跑起来（仍然是 --no-llm，不产生 LLM 调用）。
          if [ ! -d data/index ] || [ ! -f data/graph/lexweave_graph.pkl ]; then
            echo "::notice::本机无 data/index 与图镜像：跳过需要模型的评测（检索/路由/消融/人在环），这部分在本地按 README §10.2 跑"
            exit 0
          fi
          uv run python scripts/run_all_evals.py --no-llm

  neo4j-parity:
    # 独立的手动任务：只有 workflow_dispatch 勾选 neo4j_parity 才启动服务。
    # 平时这里显示 skipped，而不是伪装成「已通过」。
    name: Neo4j live parity（手动；未启动服务则整体 skipped）
    if: github.event_name == 'workflow_dispatch' && inputs.neo4j_parity
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/lexweave
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 >/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: lexweave
      GRAPH_BACKEND: auto
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装依赖（不装 torch）
        run: uv sync --extra dev --no-install-package torch
      - name: 建 NetworkX 镜像并导入 Neo4j
        run: uv run python scripts/build_graph.py --neo4j --clear
      - name: 双后端一致性（必须真的比对，不得 skipped）
        run: uv run python scripts/check_graph_parity.py --require-neo4j
